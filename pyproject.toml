[build-system]
requires = ["setuptools==75.3.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "constructor-event-prediction"
version = "0.1.0"
description = "Reproducible synthetic software-delivery next-event prediction"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.1.3",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
]

[project.scripts]
event-prediction = "event_prediction.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["event_prediction"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

